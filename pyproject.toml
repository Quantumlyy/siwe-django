[project]
name = "siwe-django"
version = "0.1.0"
description = "Reusable Django authentication for Sign-In with Ethereum."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Nejc Drobnic", email = "nejc@ethfollow.xyz" },
]
keywords = ["SIWE", "EIP-4361", "Django", "Ethereum", "authentication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "Django>=5.2,<6.1",
  "eth-utils>=2.2",
  "signinwithethereum>=5,<6",
  "web3>=7.3,<8",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.16"]
redis = ["redis>=5.0"]
cli = [
  "typer>=0.12",
  "questionary>=2.0",
  "rich>=13.7",
  "libcst>=1.4",
  "tomlkit>=0.13",
]

[project.scripts]
siwe-django = "siwe_django.cli.main:app"

[project.urls]
Homepage = "https://github.com/Quantumlyy/siwe-django"
Repository = "https://github.com/Quantumlyy/siwe-django"
Documentation = "https://github.com/Quantumlyy/siwe-django#readme"

[dependency-groups]
dev = [
  "build>=1.2",
  "djangorestframework>=3.16",
  "eth-account>=0.13",
  "libcst>=1.4",
  "pytest>=8.1",
  "pytest-django>=4.8",
  "pytest-mock>=3.14",
  "questionary>=2.0",
  "rich>=13.7",
  "ruff>=0.6",
  "tomlkit>=0.13",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siwe_django"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT009"]
"src/siwe_django/cli/main.py" = ["B008", "UP007"]
