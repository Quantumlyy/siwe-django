<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block siwe_title %}Sign in with Ethereum{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block siwe_styles %}
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; }
    button { min-height: 2.75rem; padding: 0 1rem; font: inherit; cursor: pointer; }
    pre { overflow: auto; padding: 1rem; background: #f5f5f5; }
    .siwe-success { color: #047857; }
    .siwe-error { color: #b91c1c; }
  </style>
  {% endblock %}
</head>
<body>
  {% block siwe_content %}
  <main>
    <h1>Sign in with Ethereum</h1>
    <form id="siwe-form" method="post" action="{{ verify_url }}">
      {% csrf_token %}
      {{ form.message }}
      {{ form.signature }}
      <button id="siwe-submit" type="button">Sign in with Ethereum</button>
    </form>
    <p id="siwe-status" role="status"></p>
    <pre id="siwe-result" hidden></pre>
  </main>
  {% endblock %}

  {% block siwe_scripts %}
  <script>
    const NONCE_URL = "{{ nonce_url|escapejs }}";
    const VERIFY_URL = "{{ verify_url|escapejs }}";

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function buildSiweMessage({ domain, address, uri, version, chainId, nonce, statement }) {
      const issuedAt = new Date().toISOString();
      const lines = [
        `${domain} wants you to sign in with your Ethereum account:`,
        address,
        "",
      ];
      if (statement) lines.push(statement, "");
      lines.push(
        `URI: ${uri}`,
        `Version: ${version}`,
        `Chain ID: ${chainId}`,
        `Nonce: ${nonce}`,
        `Issued At: ${issuedAt}`,
      );
      return lines.join("\n");
    }

    document.getElementById("siwe-submit").addEventListener("click", async () => {
      const form = document.getElementById("siwe-form");
      const status = document.getElementById("siwe-status");
      const result = document.getElementById("siwe-result");
      status.className = "";
      result.hidden = true;

      if (!window.ethereum) {
        status.className = "siwe-error";
        status.textContent = "No wallet provider detected.";
        return;
      }

      try {
        const [address] = await window.ethereum.request({
          method: "eth_requestAccounts",
        });
        const chainIdHex = await window.ethereum.request({ method: "eth_chainId" });
        const chainId = parseInt(chainIdHex, 16);

        const nonceResponse = await fetch(NONCE_URL, { credentials: "include" });
        const nonceJson = await nonceResponse.json();

        const message = buildSiweMessage({
          domain: nonceJson.domain || window.location.host,
          address,
          uri: nonceJson.uri || window.location.origin + "/",
          version: "1",
          chainId,
          nonce: nonceJson.nonce,
          statement: nonceJson.statement,
        });

        const signature = await window.ethereum.request({
          method: "personal_sign",
          params: [message, address],
        });

        form.elements.message.value = message;
        form.elements.signature.value = signature;

        const verifyResponse = await fetch(VERIFY_URL, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify({ message, signature }),
        });
        const verifyJson = await verifyResponse.json();
        status.className = verifyJson.success ? "siwe-success" : "siwe-error";
        status.textContent = verifyJson.success
          ? `Signed in as ${verifyJson.wallet?.displayName || address}.`
          : `Sign-in failed: ${verifyJson.message || "unknown error"}`;
        result.hidden = false;
        result.textContent = JSON.stringify(verifyJson, null, 2);
      } catch (err) {
        status.className = "siwe-error";
        status.textContent = err.message || String(err);
      }
    });
  </script>
  {% endblock %}
</body>
</html>
