{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in with Ethereum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; }
    button { padding: 0.75rem 1.25rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 0.5rem; overflow: auto; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Sign in with Ethereum</h1>
  <p>Click the button to request a nonce, sign it with your wallet, and verify
     the signature with the server.</p>
  <button id="signin">Sign in with Ethereum</button>
  <p id="status"></p>
  <pre id="result" hidden></pre>

  <script>
    const NONCE_URL = "{{ nonce_url }}";
    const VERIFY_URL = "{{ verify_url }}";

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function buildSiweMessage({ domain, address, uri, version, chainId, nonce, statement }) {
      const issuedAt = new Date().toISOString();
      const lines = [
        `${domain} wants you to sign in with your Ethereum account:`,
        address,
        "",
      ];
      if (statement) lines.push(statement, "");
      lines.push(
        `URI: ${uri}`,
        `Version: ${version}`,
        `Chain ID: ${chainId}`,
        `Nonce: ${nonce}`,
        `Issued At: ${issuedAt}`,
      );
      return lines.join("\n");
    }

    document.getElementById("signin").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      status.className = "";
      result.hidden = true;

      if (!window.ethereum) {
        status.className = "err";
        status.textContent = "No window.ethereum detected. Install MetaMask or similar.";
        return;
      }

      try {
        const [address] = await window.ethereum.request({
          method: "eth_requestAccounts",
        });
        const chainIdHex = await window.ethereum.request({ method: "eth_chainId" });
        const chainId = parseInt(chainIdHex, 16);

        const nonceResponse = await fetch(NONCE_URL, { credentials: "include" });
        const nonceJson = await nonceResponse.json();

        const message = buildSiweMessage({
          domain: nonceJson.domain || window.location.host,
          address,
          uri: nonceJson.uri || window.location.origin + "/",
          version: "1",
          chainId,
          nonce: nonceJson.nonce,
          statement: nonceJson.statement,
        });

        const signature = await window.ethereum.request({
          method: "personal_sign",
          params: [message, address],
        });

        const verifyResponse = await fetch(VERIFY_URL, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify({ message, signature }),
        });
        const verifyJson = await verifyResponse.json();
        status.className = verifyJson.success ? "ok" : "err";
        status.textContent = verifyJson.success
          ? `Signed in as ${verifyJson.wallet?.displayName || address}.`
          : `Sign-in failed: ${verifyJson.message || "unknown error"}`;
        result.hidden = false;
        result.textContent = JSON.stringify(verifyJson, null, 2);
      } catch (err) {
        status.className = "err";
        status.textContent = err.message || String(err);
      }
    });
  </script>
</body>
</html>
